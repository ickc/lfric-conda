# CI: lint, then use the environment.
#
# Every package in envs/lfric-env.yaml comes from conda-forge, where the LFRic
# packages this repo started are built per platform on their own feedstocks. What
# is left to test here is the part no feedstock can: that the assembled
# environment really is a drop-in LFRic Stage-1 environment. The stage2 jobs
# below do that on linux-64 and linux-aarch64 (Isambard 3 is Cray EX / Grace).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. On main every commit's result matters.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          # The LFRic-source patches and the Stage-2 example scripts are shipped
          # and executed too, so lint them
          # alongside scripts/ rather than only checking the drivers.
          scripts_to_check=(
            scripts/*.sh
            patches/*.sh
            examples/*/*.sh
            examples/science-suites/site/*.sh
            examples/science-suites/site/bin/launch-exe
          )
          bash -n "${scripts_to_check[@]}"
          shellcheck "${scripts_to_check[@]}"

      - name: cylc lint the science suites
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: cylc
          create-args: cylc-flow cylc-rose metomi-rose
          condarc: |
            channels:
              - conda-forge
      - name: cylc validate
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Cheap structural check of the ported suites: every flow.cylc must parse
          # and validate with the template variables run-suite.sh injects. The
          # end-to-end run happens in the stage2 jobs; this catches a broken suite
          # in seconds instead of an hour in.
          for suite in examples/science-suites/u-*; do
            echo "::group::cylc validate $suite"
            # `./` prefix is required: cylc 8.6 treats a bare relative path as a
            # workflow ID (looked up under ~/cylc-run) rather than a source dir.
            cylc validate "./$suite" \
              -S "REPO_ROOT='$PWD'" \
              -S "LFRIC_CONDA_ENV='$CONDA_PREFIX'" \
              -S "ACTIVATE_ENV='$PWD/examples/science-suites/site/activate-env.sh'" \
              -S "CYLC_PLATFORM='localhost'" \
              -S "CORES_PER_NODE=4"
            echo "::endgroup::"
          done

  # --- Stage 2: use the environment ----------------------------------------
  # These two jobs are the point of the repo: they assemble envs/lfric-env.yaml
  # from conda-forge, and then do real LFRic work with it -- compile the science
  # target, and run a real Rose/Cylc science suite end to end (extract -> build ->
  # mesh -> run).
  # They are what makes "the conda environment is a drop-in for the Spack one" a
  # tested claim rather than an assertion. See .github/workflows/stage2.yml.
  stage2-compile:
    uses: ./.github/workflows/stage2.yml
    with:
      example: minimal-compile

  stage2-suite:
    uses: ./.github/workflows/stage2.yml
    with:
      example: science-suite
