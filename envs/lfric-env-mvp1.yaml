# MVP-1: the LFRic Stage-1 environment for lfric_core, on linux-aarch64, with
# MPI from conda-forge.
#
# Everything comes from conda-forge. The four packages this project had to get
# there -- xios, blitzpp, rose-picker and a linux-aarch64, 64-bit-Xt_int yaxt --
# are at the bottom.
name: lfric-env-mvp1
channels:
  - conda-forge
dependencies:
  # --- toolchain (gcc 15.3: conda-forge's Fortran module generation) --------
  - gcc_linux-aarch64 15.3.*
  - gxx_linux-aarch64 15.3.*
  - gfortran_linux-aarch64 15.3.*
  # --- MPI + parallel I/O ---------------------------------------------------
  - mpich
  - hdf5 * mpi_mpich_*
  - libnetcdf * mpi_mpich_*
  - netcdf-fortran * mpi_mpich_*
  # --- build tooling --------------------------------------------------------
  - make
  - cmake
  - pkg-config
  - python 3.12.*
  # --- LFRic build-time python ---------------------------------------------
  - psyclone 3.3.1
  - fparser
  - sci-fab
  - jinja2
  - pyyaml
  - sympy
  # --- workflow tooling -----------------------------------------------------
  - metomi-rose
  - cylc-flow
  - cylc-rose
  - ansimarkup
  - colorama
  # --- LFRic-specific packages (conda-forge feedstocks started here) --------
  - xios 2.2701 mpi_mpich_*
  - blitzpp                # XIOS's array library; `blitz` is taken by Blitz.js
  - rose-picker            # generates LFRic's Fortran config loaders
  - yaxt * mpi_mpich_idxtype_long_*  # 64-bit Xt_int, as LFRic needs
