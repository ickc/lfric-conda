# Rose site config: Isambard 3. Same content as the one lfric-env-isambard ships
# in its module. Installed into an environment by `scripts/install-site.sh
# isambard3`, which sets ROSE_SITE_CONF_PATH on activation. See
# docs/site-config.md.
#
# [rosie-id]   the `u-` prefix map, so `rosie checkout u-...` works. Any site
#              outside the Met Office needs it; without it rosie fails with
#              "u: cannot determine prefix location". Reading roses-u still
#              needs a MOSRS account.
# [rose-stem]  SITE=isambard3, which lfric_apps' rose-stem reads to pick its site
#              config. That site is not in lfric_apps yet: it comes from the
#              rose-stem patch in lfric-env-isambard (patches/rose-stem/). Drop
#              this section if you don't apply it.

[rosie-id]
prefix-default=u
prefix-location.u=https://code.metoffice.gov.uk/svn/roses-u
prefix-web.u=https://code.metoffice.gov.uk/trac/roses-u/intertrac/source:
prefix-ws.u=https://code.metoffice.gov.uk/rosie/u

[rose-stem]
automatic-options=SITE=isambard3
